name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and (optionally) publish"
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Windows executable + verification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install -e . --disable-pip-version-check
          python -m pip install --disable-pip-version-check pyinstaller

      - name: Unit tests before packaging
        run: python run_tests.py unit

      - name: Build and verify both executables
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_exe.ps1

      - name: Show the verified manifest
        run: Get-Content dist\release.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            dist\ECE-AutoCompiler.exe
            dist\ECE-AutoCompiler-cli.exe
            dist\release.json
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $notes = "Automated release from commit $env:GITHUB_SHA. "
          $notes += "The executables were built by scripts/build_exe.ps1 and verified by tools/release_check.py "
          $notes += "(desktop launch probe, console --version and a real build/validate/package run). "
          $notes += "See CHANGELOG.md for details."
          gh release create $env:TAG dist\ECE-AutoCompiler.exe dist\ECE-AutoCompiler-cli.exe dist\release.json `
            --title "ECE Universal AutoCompiler $env:TAG" --notes $notes
