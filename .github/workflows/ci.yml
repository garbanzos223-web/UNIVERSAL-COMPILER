name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, stdlib-only runtime)
        run: python -m pip install -e . --disable-pip-version-check

      - name: Compile all sources
        run: python -m compileall -q src

      - name: Unit tests
        run: python run_tests.py unit

      # Integration tests run real builds. They skip themselves robustly when
      # a toolchain is missing, so the job stays green on any runner image;
      # installing PyInstaller here makes the real .exe builds run too.
      - name: Integration tests (real Python/Node/.exe builds)
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python run_tests.py integration
