name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable, stdlib-only runtime + decompiler extras)
        run: |
          python -m pip install -e . --disable-pip-version-check
          python -m pip install -e ".[decompile]" --disable-pip-version-check

      - name: Lint (stdlib-only compileall + AST checks)
        run: powershell -NoProfile -File scripts\lint.ps1

      - name: Decompiler catalog smoke
        run: python -m ece_autocompiler formats

      - name: Unit tests (includes decompiler/recompiler/core)
        run: |
          python run_tests.py unit 2>&1 | Tee-Object -FilePath unit-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report failing unit tests as annotations
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path unit-tests.log) {
            $fails = Select-String -Path unit-tests.log -Pattern '^(FAIL|ERROR):'
            foreach ($f in $fails) {
              Write-Output "::error title=Unit test failure::$($f.Line)"
            }
            Get-Content unit-tests.log -Tail 60
          }

      # Integration tests run real builds. They skip themselves robustly when
      # a toolchain is missing, so the job stays green on any runner image;
      # installing PyInstaller here makes the real .exe builds run too.
      - name: Integration tests (real Python/Node/.exe builds)
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python run_tests.py integration

      # GUI smoke: MainWindow + compiler dialogs + DECOMPILER tab + real
      # container extraction. Skips itself cleanly without a display.
      - name: GUI smoke
        run: python run_tests.py smoke
