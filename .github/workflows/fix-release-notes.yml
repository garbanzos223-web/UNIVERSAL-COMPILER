name: Update release notes

# One-off maintenance workflow: set the body of an existing release to a
# documentation file. Triggered by pushing this file (the 1.4.0 release was
# published with the wrong historical notes); afterwards it stays as a manual
# tool via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update"
        required: true
        default: "1.4.0"
      notes:
        description: "Documentation file with the new body"
        required: true
        default: "docs/RELEASE_NOTES_1.4.md"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set release body from docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release edit "$TAG" \
            --title "ECE Universal AutoCompiler $TAG" \
            --notes-file "$NOTES"
